[project]
name = "rag-server"
version = "0.0.0"
requires-python = ">=3.13"
dependencies = [
    "chromadb>=1.5.2",
]

[dependency-groups]
dev = [
    "mypy>=1.19.1",
    "ruff>=0.15.4",
]

[tool.uv]
required-environments = [
    "sys_platform == 'darwin' and platform_machine == 'x86_64'"
]

[tool.ruff]
target-version = "py313"
line-length = 119

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D203",
    "D213",
    "COM812",
]

[tool.mypy]
python_version = "3.13"
strict = true
